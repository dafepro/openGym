name: Publish Uplift fork Worker release
"on":
  push:
    branches:
      - codex/focused-workout-overlay
concurrency:
  group: uplift-worker-build-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    name: Verify Uplift Worker source
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/codex/focused-workout-overlay' && vars.DEPLOY_REQUESTS_ENABLED == 'true'
    timeout-minutes: 30
    steps: &id001
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check whether GitHub-hosted startup permits a Mac fallback
        id: runner_fallback
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/hosted-fallback
        with:
          job-name: Verify Uplift Worker source
          root: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - name: Install and verify fork build
        env:
          TZ: UTC
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix frontend test
          node frontend/scripts/check-locales.mjs
          node frontend/scripts/check-source-strings.mjs --strict
          npm run test:worker
          npm run build:worker
          npm run check:worker
          test ! -d frontend/dist/exercise-media
          node scripts/package-worker.mjs opengym "$GITHUB_SHA" "$RUNNER_TEMP/uplift-release"
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uplift-release
          path: ${{ runner.temp }}/uplift-release
          if-no-files-found: error
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - name: Record completed build
        id: fallback_completed
        run: echo "completed=true" >>"$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
    continue-on-error:
      ${{ github.repository == 'dafepro/openGym' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.id == 313492551)) }}
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      fallback_completed: ${{ steps.fallback_completed.outputs.completed }}
  verify_mac:
    name: Verify Uplift Worker source (Mac fallback)
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - dcarrell-mac
    if:
      ${{ !cancelled() && (github.repository == 'dafepro/openGym' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.id == 313492551))) && needs.verify.result != 'skipped' && needs.verify.outputs.fallback_completed !=
      'true' }}
    timeout-minutes: 30
    steps: *id001
    continue-on-error: false
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      fallback_completed: ${{ steps.fallback_completed.outputs.completed }}
    needs:
      - verify
  publish:
    name: Publish immutable Uplift Worker
    needs:
      - verify
      - verify_mac
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
    steps: &id002
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check whether GitHub-hosted startup permits a Mac fallback
        id: runner_fallback
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/hosted-fallback
        with:
          job-name: Publish immutable Uplift Worker
          root: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: uplift-release
          path: ${{ runner.temp }}/uplift-release
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - name: Publish retained release and request a deployment PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REQUEST_TOKEN: ${{ secrets.DEPLOY_REQUEST_TOKEN }}
        run: python3 scripts/publish-release.py uplift production opengym "$RUNNER_TEMP/uplift-release"
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - name: Record completed build
        id: fallback_completed
        run: echo "completed=true" >>"$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
    if: ${{ !cancelled() && (needs.verify.outputs.fallback_completed == 'true' || needs.verify_mac.outputs.fallback_completed == 'true') && (true) }}
    continue-on-error:
      ${{ github.repository == 'dafepro/openGym' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.id == 313492551)) }}
    outputs:
      fallback_completed: ${{ steps.fallback_completed.outputs.completed }}
  publish_mac:
    name: Publish immutable Uplift Worker (Mac fallback)
    needs:
      - verify
      - verify_mac
      - publish
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - dcarrell-mac
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
    steps: *id002
    if:
      ${{ !cancelled() && (github.repository == 'dafepro/openGym' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.id == 313492551))) && needs.publish.result != 'skipped' && needs.publish.outputs.fallback_completed !=
      'true' }}
    continue-on-error: false
    outputs:
      fallback_completed: ${{ steps.fallback_completed.outputs.completed }}
