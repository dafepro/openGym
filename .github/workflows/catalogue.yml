name: Catalogue
"on":
  pull_request:
    paths:
      - catalogue/**
      - scripts/catalogue/**
      - frontend/src/lib/exercises-data.js
      - frontend/src/instr/**
      - frontend/src/exercise-names/**
      - frontend/src/exercise-desc/**
      - .github/workflows/catalogue.yml
  push:
    branches:
      - main
    paths:
      - catalogue/**
      - scripts/catalogue/**
      - .github/workflows/catalogue.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps: &id001
      - uses: actions/checkout@v7
      - name: Check whether GitHub-hosted startup permits a Mac fallback
        id: runner_fallback
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/hosted-fallback
        with:
          job-name: validate
          root: .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - name: Validate the catalogue
        run: node scripts/catalogue/validate.mjs
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - name: Generated files are up to date
        run: node scripts/catalogue/build.mjs --check
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - name: Media stay within 180 px (licence)
        run: node scripts/catalogue/check-media.mjs
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - name: Record completed build
        id: fallback_completed
        run: echo "completed=true" >>"$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
    name: validate
    continue-on-error:
      ${{ github.repository == 'dafepro/openGym' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.id == 313492551)) }}
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      fallback_completed: ${{ steps.fallback_completed.outputs.completed }}
  validate_mac:
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - dcarrell-mac
    steps: *id001
    name: validate (Mac fallback)
    continue-on-error: false
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      fallback_completed: ${{ steps.fallback_completed.outputs.completed }}
    needs:
      - validate
    if:
      ${{ !cancelled() && (github.repository == 'dafepro/openGym' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.id == 313492551))) && needs.validate.result != 'skipped' && needs.validate.outputs.fallback_completed
      != 'true' }}
