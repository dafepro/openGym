name: Catalogue
"on":
  pull_request:
    paths:
      - catalogue/**
      - scripts/catalogue/**
      - frontend/src/lib/exercises-data.js
      - frontend/src/instr/**
      - frontend/src/exercise-names/**
      - frontend/src/exercise-desc/**
      - .github/workflows/catalogue.yml
  push:
    branches:
      - main
    paths:
      - catalogue/**
      - scripts/catalogue/**
      - .github/workflows/catalogue.yml
  workflow_dispatch:
    inputs:
      build_runner:
        description: Use the repository preference, Mac, or GitHub-hosted Ubuntu
        required: false
        type: choice
        default: default
        options:
          - default
          - mac
          - github
permissions:
  contents: read
jobs:
  validate:
    runs-on:
      ${{ (github.repository == 'dafepro/openGym' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.id == 313492551))) && (github.event.inputs.build_runner == 'mac' || (github.event.inputs.build_runner
      != 'github' && vars.BUILD_RUNNER != 'github')) && fromJSON('["self-hosted","macOS","ARM64","dcarrell-mac"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate the catalogue
        run: node scripts/catalogue/validate.mjs
      - name: Generated files are up to date
        run: node scripts/catalogue/build.mjs --check
      - name: Media stay within 180 px (licence)
        run: node scripts/catalogue/check-media.mjs
    name: validate
    permissions:
      contents: read
      actions: read
      checks: read
