name: Deploy demo to GitHub Pages
"on":
  push:
    branches:
      - main
    paths:
      - frontend/**
      - catalogue/**
      - scripts/catalogue/**
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      build_runner:
        description: Use the repository preference, Mac, or GitHub-hosted Ubuntu
        required: false
        type: choice
        default: default
        options:
          - default
          - mac
          - github
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on:
      ${{ (github.repository == 'dafepro/openGym' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.id == 313492551))) && (github.event.inputs.build_runner == 'mac' || (github.event.inputs.build_runner
      != 'github' && vars.BUILD_RUNNER != 'github')) && fromJSON('["self-hosted","macOS","ARM64","dcarrell-mac"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_DEMO: "1"
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
    name: build
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
      checks: read
  deploy:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
    if: ${{ !cancelled() && (needs.build.result == 'success') && (true) }}
