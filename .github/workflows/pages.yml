name: Deploy demo to GitHub Pages
'on':
  push:
    branches:
      - main
    paths:
      - frontend/**
      - catalogue/**
      - scripts/catalogue/**
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      build_runner:
        description: Use the repository preference, Mac, or GitHub-hosted Ubuntu
        required: false
        type: choice
        default: default
        options:
          - default
          - mac
          - github
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: >-
      ${{ (github.repository == 'dafepro/openGym' && ((github.event_name != 'pull_request' && github.event_name !=
      'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.id == 313492551))) && (github.event.inputs.build_runner == 'mac' ||
      (github.event.inputs.build_runner != 'github' && vars.BUILD_RUNNER != 'github')) &&
      fromJSON('["self-hosted","macOS","ARM64","dcarrell-mac"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_DEMO: '1'
          VITE_NO_MEDIA: '1'
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
        if: github.repository == 'DuarteSantos8/openGym'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: frontend/dist
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
      checks: read
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
