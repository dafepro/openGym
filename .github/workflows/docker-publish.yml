name: Publish Docker images
"on":
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch: null
permissions:
  contents: read
  packages: write
jobs:
  build_api:
    runs-on: ubuntu-24.04
    steps: &id001
      - uses: actions/checkout@v7
      - name: Check whether GitHub-hosted startup permits a Mac fallback
        id: runner_fallback
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/hosted-fallback
        with:
          job-name: build_api
          root: .
      - name: Lowercase owner (registry names must be lowercase)
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - name: Set version metadata
        id: version_meta
        run: |
          # On a release the ref is refs/tags/vX.Y.Z; on a main push it is a branch ref,
          # which would otherwise label the image "refs/heads/main".
          case "$GITHUB_REF" in
            refs/tags/*) VERSION="${GITHUB_REF#refs/tags/}" ;;
            *)           VERSION="main-${GITHUB_SHA::7}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VCS_REF=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - uses: docker/setup-qemu-action@v4
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - uses: docker/setup-buildx-action@v4
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/opengym-api
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version_meta.outputs.VERSION }}
            VCS_REF=${{ steps.version_meta.outputs.VCS_REF }}
            BUILD_DATE=${{ steps.version_meta.outputs.BUILD_DATE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ runner.environment == 'github-hosted' && 'type=gha,scope=api' || '' }}
          cache-to: ${{ runner.environment == 'github-hosted' && 'type=gha,mode=max,scope=api' || '' }}
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - name: Record completed build
        id: fallback_completed
        run: echo "completed=true" >>"$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
    name: build_api
    continue-on-error:
      ${{ github.repository == 'dafepro/openGym' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.id == 313492551)) }}
    permissions:
      contents: read
      packages: write
      actions: read
      checks: read
    outputs:
      fallback_completed: ${{ steps.fallback_completed.outputs.completed }}
  build_api_mac:
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - dcarrell-mac
    steps: *id001
    name: build_api (Mac fallback)
    continue-on-error: false
    permissions:
      contents: read
      packages: write
      actions: read
      checks: read
    outputs:
      fallback_completed: ${{ steps.fallback_completed.outputs.completed }}
    needs:
      - build_api
    if:
      ${{ !cancelled() && (github.repository == 'dafepro/openGym' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.id == 313492551))) && needs.build_api.result != 'skipped' && needs.build_api.outputs.fallback_completed
      != 'true' }}
  build_web:
    runs-on: ubuntu-24.04
    steps: &id002
      - uses: actions/checkout@v7
      - name: Check whether GitHub-hosted startup permits a Mac fallback
        id: runner_fallback
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/hosted-fallback
        with:
          job-name: build_web
          root: .
      - name: Lowercase owner (registry names must be lowercase)
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - name: Set version metadata
        id: version_meta
        run: |
          # On a release the ref is refs/tags/vX.Y.Z; on a main push it is a branch ref,
          # which would otherwise label the image "refs/heads/main".
          case "$GITHUB_REF" in
            refs/tags/*) VERSION="${GITHUB_REF#refs/tags/}" ;;
            *)           VERSION="main-${GITHUB_SHA::7}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VCS_REF=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - uses: docker/setup-qemu-action@v4
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - uses: docker/setup-buildx-action@v4
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/opengym-web
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version_meta.outputs.VERSION }}
            VCS_REF=${{ steps.version_meta.outputs.VCS_REF }}
            BUILD_DATE=${{ steps.version_meta.outputs.BUILD_DATE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ runner.environment == 'github-hosted' && 'type=gha,scope=web' || '' }}
          cache-to: ${{ runner.environment == 'github-hosted' && 'type=gha,mode=max,scope=web' || '' }}
        if: ${{ (true) && (runner.environment != 'self-hosted' || steps.runner_fallback.outputs.run != 'false') }}
      - name: Record completed build
        id: fallback_completed
        run: echo "completed=true" >>"$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}
    name: build_web
    continue-on-error:
      ${{ github.repository == 'dafepro/openGym' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.id == 313492551)) }}
    permissions:
      contents: read
      packages: write
      actions: read
      checks: read
    outputs:
      fallback_completed: ${{ steps.fallback_completed.outputs.completed }}
  build_web_mac:
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - dcarrell-mac
    steps: *id002
    name: build_web (Mac fallback)
    continue-on-error: false
    permissions:
      contents: read
      packages: write
      actions: read
      checks: read
    outputs:
      fallback_completed: ${{ steps.fallback_completed.outputs.completed }}
    needs:
      - build_web
    if:
      ${{ !cancelled() && (github.repository == 'dafepro/openGym' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.id == 313492551))) && needs.build_web.result != 'skipped' && needs.build_web.outputs.fallback_completed
      != 'true' }}
